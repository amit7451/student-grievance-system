# ==============================================================================
# Production Docker Compose for Student Grievance Management System
# ==============================================================================
name: student-grievance-system

services:
  # ----------------------------------------------------------------------------
  # Database Service (MongoDB)
  # ----------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: student-grievance-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_DATABASE=grievance_db
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - grievance-network

  # ----------------------------------------------------------------------------
  # Backend API Service (Node.js + Express)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student-grievance-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/grievance_db}
      - JWT_SECRET=${JWT_SECRET:-student_grievance_jwt_secret_key_change_me}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - grievance-network

  # ----------------------------------------------------------------------------
  # Frontend Web Service (React + Vite + Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: student-grievance-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - grievance-network

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  mongo-data:
    name: student-grievance-mongo-data

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  grievance-network:
    name: student-grievance-network
    driver: bridge
