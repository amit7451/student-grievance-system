# ==============================================================================
# Development Docker Compose with Hot Reloading (nodemon + Vite HMR)
# Run with: docker compose -f docker-compose.dev.yml up --build
# ==============================================================================
name: student-grievance-system-dev

services:
  # ----------------------------------------------------------------------------
  # Database Service (MongoDB)
  # ----------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: student-grievance-mongo-dev
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data-dev:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - grievance-dev-network

  # ----------------------------------------------------------------------------
  # Backend API Service (Live code reload with nodemon)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: student-grievance-backend-dev
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/grievance_db}
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_student_grievance_system}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - grievance-dev-network

  # ----------------------------------------------------------------------------
  # Frontend Web Service (Live Vite Hot Module Replacement)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: student-grievance-frontend-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - grievance-dev-network

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  mongo-data-dev:
    name: student-grievance-mongo-data-dev

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  grievance-dev-network:
    name: student-grievance-dev-network
    driver: bridge
